name: CI

# The same file in every plugin of the family. It runs on the platforms the
# plugins support, and besides the Go checks it drives the real TUI on a pty
# (scripts/pty-check.py), which is what says the popup works on Linux too.

on:
  push:
    branches: [main]
    # Nothing here is built or tested from these. The release commit only
    # touches CHANGELOG.md, the manifest version and docs/demo.gif, and the
    # release workflow vets and tests that very commit again.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'herdr-plugin.toml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'herdr-plugin.toml'

permissions:
  contents: read

# A newer push to the same ref makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A pty check that hangs must not sit on a runner for six hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Formatting and shell syntax do not depend on the platform.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Shell syntax
        if: matrix.os == 'ubuntu-latest'
        run: sh -n scripts/fetch-binary.sh scripts/release.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: TUI check on a pty
        run: |
          python3 -m pip install --quiet pyte==0.8.2
          name="${GITHUB_REPOSITORY#*/}"
          go build -o "$name" .
          python3 scripts/pty-check.py "./$name"
