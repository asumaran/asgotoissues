name: CI

# The same file in every plugin of the family. It runs on the platforms the
# plugins support, and besides the Go checks it drives the real TUI on a pty
# (scripts/pty-check.py), which is what says the popup works on Linux too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shell syntax
        run: sh -n scripts/fetch-binary.sh scripts/release.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: TUI check on a pty
        run: |
          python3 -m pip install --quiet pyte
          name="${GITHUB_REPOSITORY#*/}"
          go build -o "$name" .
          python3 scripts/pty-check.py "./$name"
