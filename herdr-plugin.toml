id = "asumaran.asgotoissues"
name = "asgotoissues"
version = "0.10.0"
min_herdr_version = "0.7.5"
description = "Jump to your open issues (Jira, GitHub) across every configured stack"
platforms = ["linux", "macos"]

[[build]]
command = ["scripts/fetch-binary.sh"]

[[actions]]
id = "open"
title = "Open issue switcher"
contexts = ["global"]
command = ["scripts/open-pane.sh"]

[[panes]]
id = "picker"
title = "asgotoissues"
placement = "popup"
width = "85%"
height = "90%"
command = ["./asgotoissues"]
