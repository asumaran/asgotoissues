id = "asumaran.asgotoissues"
name = "asgotoissues"
version = "0.4.0"
min_herdr_version = "0.7.5"
description = "Jump to your open Jira tickets across every configured stack"
platforms = ["macos"]

[[build]]
command = ["scripts/fetch-binary.sh"]

[[actions]]
id = "open"
title = "Open Jira ticket switcher"
contexts = ["global"]
command = ["scripts/open-pane.sh"]

[[panes]]
id = "picker"
title = "Jira"
placement = "popup"
width = "85%"
height = "90%"
command = ["./asgotoissues"]
